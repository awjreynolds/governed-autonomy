governanceVersion: "1"
process:
  id: cold-start-feature-delivery
  name: Cold-start feature delivery
  purpose: Draft and approve a small feature change with durable evidence.
roles:
  - id: tech_lead
    label: Tech lead
    accountable_for: Merge decisions and release readiness.
  - id: agent
    label: Coding agent
    autonomous: true
    accountable_for: nothing
authority:
  default_autonomy_tier: draft
  default_allowed_actions: ["catalog:action:draft-artifact"]
  prohibited_actions: ["catalog:action:approve-own-work"]
risk:
  patterns: ["catalog:risk:scope-creep-at-machine-speed"]
  blast_radius: repository
evidence:
  destination: repo
  items:
    - id: design-record
      kind: "catalog:evidence:design-decision"
      producer: "step:design"
      consumer: ["role:tech_lead"]
gates:
  - id: design-approval
    requires_role: "role:tech_lead"
    requires_evidence: ["evidence:design-record"]
    blocks_steps: ["step:approve"]
escalation:
  - condition: verification-fails
    to: "role:tech_lead"
state:
  canonical: repo
  projections: ["tracker"]
freshness:
  drift_policy: Review when authority or evidence requirements change.
steps:
  - id: design
    label: Design
    purpose: Draft the design record for a human approval decision.
    step_kind: execute
    requires_role: "role:agent"
  - id: approve
    label: Approve
    purpose: Approve the design record after evidence review.
    step_kind: approve
    requires_role: "role:tech_lead"
    authority_overrides:
      autonomy_tier: human_only
warnings: []
knownGaps: []

