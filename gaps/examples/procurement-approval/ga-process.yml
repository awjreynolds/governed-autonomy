schemaVersion: "0.1"
status: exploratory
formatWarning: "GAPS v0.1 is not stable. This file is a reference process, not a compliance, certification, or legal sufficiency artifact."

standards_alignment:
  posture: "This procurement-approval profile is compatible with BPMN, CMMN, DMN, OSCAL, ISO/IEC 42001, and NIST AI RMF concepts, but does not replace any standard or claim conformance."
  compatible_concepts:
    - standard: bpmn
      applies_to:
        - request approval flow
        - budget gate
        - contract handoff
        - rejection and rework paths
      status: candidate
    - standard: cmmn
      applies_to:
        - adaptive supplier review case
        - discretionary security and legal tasks
        - evidence file state
      status: candidate
    - standard: dmn
      applies_to:
        - spend threshold decisions
        - supplier risk decisions
        - conflict-of-interest rules
        - contract route decisions
      status: candidate
    - standard: oscal
      applies_to:
        - control mapping for supplier governance
        - implementation status notes
        - assessment evidence references
      status: candidate
  standard_aliases:
    - concept: approval threshold
      aliases:
        - standard: dmn
          term: decision table
        - standard: gaps
          term: approvalCondition
      status: candidate
    - concept: supplier review case
      aliases:
        - standard: cmmn
          term: case file
        - standard: gaps
          term: canonicalState
      status: candidate
    - concept: segregation of duties
      aliases:
        - standard: oscal
          term: control implementation statement
        - standard: gaps
          term: gate approvalRole
      status: candidate
    - concept: rework route
      aliases:
        - standard: bpmn
          term: gateway branch
        - standard: gaps
          term: escalationCondition
      status: candidate
  gaps_extensions:
    - autonomy_tier
    - authority_plane
    - named_human_accountability
    - budget_state_binding
    - approver_independence
    - supplier_risk_gate
    - governed_autonomy_risk_patterns

process:
  id: procurement_approval
  name: Procurement Approval
  purpose: >
    Coordinate procurement intake, supplier assessment, budget approval,
    contract review, purchase authorization, and post-approval monitoring while
    preserving segregation of duties and named human accountability.
  scope:
    includes:
      - purchase request intake
      - budget and spend-threshold review
      - supplier risk review
      - security and privacy questionnaire routing
      - contract review handoff
      - purchase approval and record retention
      - renewal and spend-monitoring reminders
    excludes:
      - autonomous supplier selection
      - autonomous contract signature
      - autonomous budget approval
      - bypassing competitive procurement rules
      - final legal advice

canonicalState:
  source: procurement-ledger
  pathPattern: "procurement/requests/{requestId}/request-record.yml"
  relationshipToGaps:
    gaProcessYml: "Describes the procurement process type, roles, thresholds, authority boundaries, evidence, and risk gates."
    requestRecordYml: "Records one request's budget state, supplier facts, risk reviews, approvals, contract status, and monitoring obligations."
  projectionRule: "ERP, ticketing, contract repository, email, calendar, and supplier portal records are projections. The procurement ledger remains canonical for workflow state."

freshness:
  reviewedAt: "2026-05-18"
  reviewCadence: quarterly
  policyClocks:
    intakeCompleteness:
      basis: "Purchase requests should not enter review until minimum facts exist."
      startEvent: purchase_request_submitted
      targetDays: 2
      warningAtDaysRemaining: 1
      ownerRole: procurement_owner
    supplierRiskReview:
      basis: "Supplier risk review should complete before budget or contract approval is treated as final."
      startEvent: supplier_review_required
      targetDays: 10
      warningAtDaysRemaining: 3
      ownerRole: supplier_risk_owner
    renewalReview:
      basis: "Renewals require enough notice to reassess value, risk, and budget."
      startEvent: renewal_window_opened
      targetDaysBeforeRenewal: 45
      warningAtDaysRemaining: 15
      ownerRole: procurement_owner
  driftPolicy: >
    If supplier scope, price, budget holder, contract terms, risk rating,
    conflict status, or renewal date changes before this reference process is
    updated, record drift in the procurement ledger and escalate when the change
    affects authority, budget, supplier risk, or approval validity.

roles:
  requester:
    label: Named Business Requester
    namedIdentities:
      example: "Jules Carter, Department Manager"
    decisionRights:
      - submit business need
      - confirm functional requirements
      - accept or revise supplier short list
  procurement_owner:
    label: Named Procurement Owner
    namedIdentities:
      example: "Samira Khan, Procurement Lead"
    authorityLevel: process_owner
    decisionRights:
      - confirm intake completeness
      - route supplier and budget reviews
      - maintain procurement ledger
      - reject incomplete requests
  budget_holder:
    label: Named Budget Holder
    namedIdentities:
      example: "Victor Chen, Finance Partner"
    authorityLevel: budget_authority
    decisionRights:
      - approve spend within delegated limit
      - reject or cap spend
      - require business case rework
  supplier_risk_owner:
    label: Named Supplier Risk Owner
    namedIdentities:
      example: "Priya Rao, Supplier Risk Lead"
    authorityLevel: risk_authority
    decisionRights:
      - approve risk tier
      - require security, privacy, or resilience review
      - block unsupported supplier-risk conclusions
  legal_contact:
    label: Named Legal or Contract Contact
    namedIdentities:
      example: "Noah Ellis, Commercial Counsel"
    authorityLevel: contract_authority
    decisionRights:
      - approve contract route
      - require legal review
      - block autonomous contract interpretation
  approver:
    label: Named Independent Approver
    namedIdentities:
      example: "Mina Brooks, COO Delegate"
    authorityLevel: approval_authority
    decisionRights:
      - approve purchase after required gates
      - reject purchase
      - require independent review
  autonomous_system:
    label: Procurement assistant operating inside approved boundaries
    authorityLevel: non-human-assistant
    decisionRights:
      - summarize request and supplier facts
      - draft routing and evidence checklists
      - monitor threshold and renewal triggers
      - recommend escalation
      - stop when budget, conflict, contract, or risk authority is insufficient

autonomyVocabulary:
  tiers:
    - assist
    - recommend
    - draft
    - execute_with_approval
    - execute_within_limits
    - autonomous_with_monitoring
  riskTiers:
    - low
    - medium
    - high
    - human_only
  gateTypes:
    - advisory
    - validating
    - blocking
    - escalating
  authorityPlanes:
    - data_plane
    - control_plane

lanes:
  intake_and_business_need:
    purpose: Establish the business need, minimum request facts, and canonical request record.
    activities:
      - collect purchase request
      - capture business objective
      - identify supplier or sourcing need
      - check minimum information
      - open procurement ledger
    states:
      - request_submitted
      - awaiting_minimum_information
      - intake_complete
      - rejected_incomplete
      - redirected_to_sourcing
    autonomousResponsibilities:
      - extract requested item, supplier, price, and deadline
      - draft business-need summary
      - identify missing intake facts
      - recommend procurement route
    authority:
      plane: data_plane
      autonomyTier: draft
      riskTier: low
      allowed:
        - draft intake record
        - recommend missing information list
        - prepare requester clarification
      prohibited:
        - approve business need
        - select supplier as final
        - bypass sourcing or conflict checks
    evidence:
      input:
        - purchase request
        - requester identity
        - initial supplier information
        - expected spend
      completion:
        - request-record.yml
        - business need summary
        - minimum information checklist
        - initial route recommendation
    gates:
      - id: intake_completeness
        gateType: validating
        approvalRole: procurement_owner
        approvalCondition: "Procurement owner confirms minimum request facts and route are present."
        escalationCondition: "Request is urgent, incomplete, sole-source, conflicted, or outside standard procurement route."

  supplier_and_policy_review:
    purpose: Assess supplier risk, policy applicability, conflicts, and required specialist reviews.
    activities:
      - classify supplier risk
      - check conflict-of-interest declaration
      - route security and privacy review
      - check sourcing policy
      - record unresolved risk
    states:
      - supplier_review_pending
      - low_risk_supplier
      - specialist_review_required
      - conflict_review_required
      - supplier_rejected
    autonomousResponsibilities:
      - summarize supplier profile
      - draft policy applicability notes
      - flag missing conflict declarations
      - recommend specialist review route
    authority:
      plane: data_plane
      autonomyTier: recommend
      riskTier: medium
      allowed:
        - recommend supplier risk tier
        - draft policy route
        - prepare specialist questionnaire
      prohibited:
        - approve supplier risk
        - clear conflicts of interest
        - waive security, privacy, or resilience review
    evidence:
      input:
        - intake record
        - supplier profile
        - conflict declaration
        - sourcing policy
        - risk threshold matrix
      completion:
        - supplier risk note
        - conflict check status
        - specialist review route
        - unresolved risk register
    gates:
      - id: supplier_risk_validation
        gateType: validating
        approvalRole: supplier_risk_owner
        approvalCondition: "Supplier risk owner validates risk tier, required specialist reviews, and unresolved risk."
        escalationCondition: "Supplier handles sensitive data, critical service, high resilience dependency, or unresolved conflict."
      - id: conflict_escalation
        gateType: escalating
        approvalRole: approver
        approvalCondition: "Independent approver confirms conflict disposition before purchase approval can proceed."
        escalationCondition: "Requester, approver, or supplier relationship creates perceived or actual conflict."

  budget_and_value_approval:
    purpose: Confirm budget availability, spend threshold, value rationale, and independent budget approval.
    activities:
      - check budget line
      - compare spend threshold
      - review business value
      - approve, cap, or reject spend
      - record budget state
    states:
      - budget_review_pending
      - budget_approved
      - budget_capped
      - budget_rejected
      - executive_spend_approval_required
    autonomousResponsibilities:
      - draft value summary
      - compare spend against thresholds
      - calculate renewal or total-contract value when provided
      - flag missing budget evidence
    authority:
      plane: control_plane
      autonomyTier: draft
      riskTier: high
      allowed:
        - draft budget approval packet
        - recommend threshold route
        - update ledger after human budget decision
      prohibited:
        - approve spend
        - split purchases to avoid threshold
        - change budget owner
        - hide total contract value or renewal cost
    evidence:
      input:
        - expected spend
        - budget line
        - value rationale
        - threshold matrix
        - supplier risk note
      completion:
        - budget decision
        - named budget holder
        - approved limit or rejection reason
        - total cost note
    gates:
      - id: budget_approval
        gateType: blocking
        approvalRole: budget_holder
        approvalCondition: "Budget holder approves amount, budget line, total cost basis, and any spending limit."
        escalationCondition: "Spend exceeds delegated authority, budget is unavailable, or value rationale is insufficient."
      - id: spend_threshold_escalation
        gateType: escalating
        approvalRole: approver
        approvalCondition: "Independent approver confirms threshold route and segregation of duties."
        escalationCondition: "Requester and budget approver are not independent, threshold is disputed, or purchase is split."

  contract_and_purchase_authorization:
    purpose: Complete contract route, confirm required reviews, and authorize purchase only after prior gates are satisfied.
    activities:
      - select contract route
      - collect legal or template approval
      - verify required reviews
      - approve purchase
      - record purchase decision
    states:
      - contract_review_pending
      - standard_terms_accepted
      - legal_review_required
      - purchase_authorized
      - purchase_rejected
    autonomousResponsibilities:
      - draft approval checklist
      - compare contract route against policy
      - summarize prior gate outcomes
      - prepare purchase decision record
    authority:
      plane: control_plane
      autonomyTier: draft
      riskTier: high
      allowed:
        - draft purchase authorization packet
        - verify presence of prior gate evidence
        - update ledger after named approval
      prohibited:
        - sign contract
        - approve purchase
        - interpret non-standard terms as acceptable
        - continue when prior gate evidence is missing
    evidence:
      input:
        - budget approval
        - supplier risk validation
        - conflict disposition
        - contract route
        - prior gate outcomes
      completion:
        - purchase authorization
        - named independent approver
        - contract route record
        - procurement decision log
    gates:
      - id: contract_route_approval
        gateType: blocking
        approvalRole: legal_contact
        approvalCondition: "Legal or contract contact confirms standard terms, approved template, or legal review route."
        escalationCondition: "Contract includes non-standard terms, data processing, liability change, or unusual renewal obligations."
      - id: purchase_authorization
        gateType: blocking
        approvalRole: approver
        approvalCondition: "Independent approver confirms required gates, segregation of duties, and purchase decision."
        escalationCondition: "Prior gate evidence is missing, approver independence is weak, or residual risk is unowned."

  monitoring_and_renewal:
    purpose: Track obligations, renewal dates, spend drift, supplier risk changes, and closure evidence.
    activities:
      - record renewal date
      - track obligations
      - monitor spend drift
      - trigger renewal review
      - close procurement record
    states:
      - purchase_active
      - obligations_tracking
      - renewal_review_due
      - spend_drift_detected
      - procurement_record_closed
    autonomousResponsibilities:
      - monitor renewal and review dates
      - draft renewal review reminders
      - flag spend or scope drift
      - summarize supplier obligations
    authority:
      plane: data_plane
      autonomyTier: autonomous_with_monitoring
      riskTier: medium
      allowed:
        - create renewal reminders
        - flag spend drift
        - update non-authoritative monitoring notes
      prohibited:
        - renew contract
        - approve expanded scope
        - close obligations without evidence
    evidence:
      input:
        - purchase authorization
        - contract metadata
        - renewal date
        - supplier obligations
        - spend record
      completion:
        - renewal reminder schedule
        - obligation register
        - spend drift note
        - closure or renewal-review trigger
    gates:
      - id: renewal_review_trigger
        gateType: validating
        approvalRole: procurement_owner
        approvalCondition: "Procurement owner confirms renewal review is scheduled with current spend, scope, and risk evidence."
        escalationCondition: "Renewal is automatic, spend drift exists, supplier risk changed, or owner is missing."
      - id: obligation_closure
        gateType: blocking
        approvalRole: procurement_owner
        approvalCondition: "Procurement owner confirms obligations are complete or transferred before record closure."
        escalationCondition: "Open obligations, unresolved risk, or missing contract evidence remain."

governedAutonomyRiskPatterns:
  uncontrolledSpend:
    coveredBy:
      - budget_approval
      - spend_threshold_escalation
  approverConflict:
    coveredBy:
      - conflict_escalation
      - purchase_authorization
  hiddenSupplierRisk:
    coveredBy:
      - supplier_risk_validation
      - contract_route_approval
  projectionDrift:
    coveredBy:
      - canonicalState.projectionRule
      - renewal_review_trigger
  authorityExpansion:
    coveredBy:
      - purchase_authorization
      - obligation_closure

controlMappings:
  - source: ISO/IEC 42001
    controlId: Annex A supplier governance candidate
    mappingStatus: candidate
    implementationStatus: "Supplier risk, authority, and monitoring concepts are represented as gates, evidence, and named roles."
    evidenceReferences:
      - supplier risk note
      - purchase authorization
      - obligation register
  - source: NIST AI RMF
    controlId: GOVERN supply-chain candidate
    mappingStatus: candidate
    implementationStatus: "Procurement governance concepts are represented as human accountability, approval gates, and risk mapping stubs."
    evidenceReferences:
      - request-record.yml
      - supplier_risk_validation
      - budget_approval
  - source: OSCAL
    controlId: procurement-control-profile
    mappingStatus: unmapped
    implementationStatus: "Fields leave room for later OSCAL control implementation and assessment evidence export."
    evidenceReferences:
      - controlMappings
      - procurement decision log

knownGaps:
  - id: local-policy-thresholds
    summary: "Spend thresholds, sourcing rules, and contract routes are illustrative and must be bound to local policy."
  - id: supplier-system-integration
    summary: "This reference process does not integrate with ERP, vendor-risk, contract, or identity systems."
  - id: conflict-rules
    summary: "Conflict-of-interest handling is represented as gates, but local definitions and disclosure workflow are not specified."
