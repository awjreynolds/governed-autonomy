evidenceModel:
  caseFileItems:
    - id: migrated-process-state
      label: "Migrated v0.1 process state placeholder"
      kind: state-transition-event
      producer: lane:detection_and_triage
      consumer:
        - role:detector
lanes:
  - id: detection_and_triage
    label: "Detection And Triage"
    purpose: >
      Accept an incident signal, create canonical state, classify severity, and assign command.
    authority:
      plane: data_plane
      autonomyTier: recommend
      riskTier: medium
      allowedActions:
        - propose-classification
      prohibitedActions:
        - declare-final-classification
        - draft-artifact
    stateModel:
      states:
        - id: signal_received
          label: signal_received
          isInitial: true
        - id: incident_opened
          label: incident_opened
        - id: severity_pending
          label: severity_pending
        - id: severity_confirmed
          label: severity_confirmed
        - id: false_positive_closed
          label: false_positive_closed
          isTerminal: true
      transitions:
        - id: t-signal-received-to-incident-opened
          from: signal_received
          to: incident_opened
        - id: t-incident-opened-to-severity-pending
          from: incident_opened
          to: severity_pending
        - id: t-severity-pending-to-severity-confirmed
          from: severity_pending
          to: severity_confirmed
        - id: t-severity-confirmed-to-false-positive-closed
          from: severity_confirmed
          to: false_positive_closed
    autonomousResponsibilities:
      - infer-from-missing-evidence
      - approve-route
    skills: []
  - id: containment_and_stabilization
    label: "Containment And Stabilization"
    purpose: >
      Decide and execute reversible containment actions inside explicit blast-radius and authority limits.
    authority:
      plane: data_plane
      autonomyTier: execute_with_approval
      riskTier: high
      allowedActions: []
      prohibitedActions:
        - perform-destructive-containment
        - update-local-state
    stateModel:
      states:
        - id: containment_options_pending
          label: containment_options_pending
          isInitial: true
        - id: containment_approved
          label: containment_approved
        - id: containment_in_progress
          label: containment_in_progress
        - id: stabilized
          label: stabilized
        - id: containment_escalated
          label: containment_escalated
          isTerminal: true
      transitions:
        - id: t-containment-options-pending-to-containment-approved
          from: containment_options_pending
          to: containment_approved
        - id: t-containment-approved-to-containment-in-progress
          from: containment_approved
          to: containment_in_progress
        - id: t-containment-in-progress-to-stabilized
          from: containment_in_progress
          to: stabilized
        - id: t-stabilized-to-containment-escalated
          from: stabilized
          to: containment_escalated
    autonomousResponsibilities:
      - draft-decision-record
      - perform-destructive-containment
    skills: []
  - id: investigation_and_evidence
    label: "Investigation And Evidence"
    purpose: >
      Preserve evidence and determine causal hypotheses without corrupting source data.
    authority:
      plane: data_plane
      autonomyTier: execute_within_limits
      riskTier: medium
      allowedActions:
        - read-external-system-state
        - observe-evidence
      prohibitedActions:
        - destroy-evidence-or-state
    stateModel:
      states:
        - id: evidence_preservation_pending
          label: evidence_preservation_pending
          isInitial: true
        - id: evidence_preserved
          label: evidence_preserved
        - id: hypothesis_drafting
          label: hypothesis_drafting
        - id: root_cause_candidate_ready
          label: root_cause_candidate_ready
        - id: investigation_blocked
          label: investigation_blocked
          isTerminal: true
      transitions:
        - id: t-evidence-preservation-pending-to-evidence-preserved
          from: evidence_preservation_pending
          to: evidence_preserved
        - id: t-evidence-preserved-to-hypothesis-drafting
          from: evidence_preserved
          to: hypothesis_drafting
        - id: t-hypothesis-drafting-to-root-cause-candidate-ready
          from: hypothesis_drafting
          to: root_cause_candidate_ready
        - id: t-root-cause-candidate-ready-to-investigation-blocked
          from: root_cause_candidate_ready
          to: investigation_blocked
    autonomousResponsibilities:
      - observe-evidence
      - propose-mitigation
    skills: []
  - id: communication_and_notification
    label: "Communication And Notification"
    purpose: >
      Prepare and issue accurate, approved communication for internal stakeholders and affected parties.
    authority:
      plane: data_plane
      autonomyTier: draft
      riskTier: high
      allowedActions:
        - draft-decision-record
      prohibitedActions: []
    stateModel:
      states:
        - id: communication_needed
          label: communication_needed
          isInitial: true
        - id: draft_update_ready
          label: draft_update_ready
        - id: approval_pending
          label: approval_pending
        - id: communication_issued
          label: communication_issued
        - id: notification_escalated
          label: notification_escalated
          isTerminal: true
      transitions:
        - id: t-communication-needed-to-draft-update-ready
          from: communication_needed
          to: draft_update_ready
        - id: t-draft-update-ready-to-approval-pending
          from: draft_update_ready
          to: approval_pending
        - id: t-approval-pending-to-communication-issued
          from: approval_pending
          to: communication_issued
        - id: t-communication-issued-to-notification-escalated
          from: communication_issued
          to: notification_escalated
    autonomousResponsibilities:
      - update-local-state
    skills: []
  - id: recovery_and_closure
    label: "Recovery And Closure"
    purpose: >
      Verify recovery, approve closure, capture lessons, and track follow-up remediation.
    authority:
      plane: data_plane
      autonomyTier: draft
      riskTier: medium
      allowedActions:
        - propose-plan
      prohibitedActions:
        - approve-gate
        - close-unverified-work
    stateModel:
      states:
        - id: recovery_in_progress
          label: recovery_in_progress
          isInitial: true
        - id: recovery_verified
          label: recovery_verified
        - id: closure_pending
          label: closure_pending
        - id: incident_closed
          label: incident_closed
        - id: follow_up_tracking
          label: follow_up_tracking
          isTerminal: true
      transitions:
        - id: t-recovery-in-progress-to-recovery-verified
          from: recovery_in_progress
          to: recovery_verified
        - id: t-recovery-verified-to-closure-pending
          from: recovery_verified
          to: closure_pending
        - id: t-closure-pending-to-incident-closed
          from: closure_pending
          to: incident_closed
        - id: t-incident-closed-to-follow-up-tracking
          from: incident_closed
          to: follow_up_tracking
    autonomousResponsibilities:
      - observe-evidence
      - draft-artifact
    skills: []
gates:
  - id: commander_assignment
    label: "Commander Assignment"
    gateType: blocking
    approvalRole: incident_commander
    approvalCondition: >
      Named incident commander accepts command before coordinated response begins.
    escalationCondition: "No qualified commander is available within the triage timebox."
  - id: severity_validation
    label: "Severity Validation"
    gateType: validating
    approvalRole: incident_commander
    approvalCondition: "Incident commander validates severity, scope, and minimum evidence."
    escalationCondition: >
      Severity may be high, customer-impacting, safety-impacting, or privacy-relevant.
  - id: containment_approval
    label: "Containment Approval"
    gateType: blocking
    approvalRole: incident_commander
    approvalCondition: >
      Incident commander approves containment action, blast radius, rollback path, and owner.
    escalationCondition: >
      Containment may cause customer data loss, service-wide outage, safety impact, or irreversible change.
  - id: executive_risk_acceptance
    label: "Executive Risk Acceptance"
    gateType: escalating
    approvalRole: executive_sponsor
    approvalCondition: >
      Executive sponsor accepts exceptional customer, revenue, safety, or reputation impact.
    escalationCondition: "Containment tradeoff exceeds delegated operational authority."
  - id: evidence_preservation
    label: "Evidence Preservation"
    gateType: validating
    approvalRole: technical_lead
    approvalCondition: >
      Technical lead confirms evidence sources, preservation method, and read-only boundaries.
    escalationCondition: >
      Evidence may include sensitive data, legal hold material, or privileged records.
  - id: restricted_evidence_access
    label: "Restricted Evidence Access"
    gateType: escalating
    approvalRole: legal_or_privacy_contact
    approvalCondition: >
      Legal or privacy contact approves access to restricted or sensitive evidence.
    escalationCondition: >
      Investigation requires personal data, customer data, privileged material, or regulated logs.
  - id: communication_approval
    label: "Communication Approval"
    gateType: blocking
    approvalRole: communications_lead
    approvalCondition: >
      Communications lead approves wording, audience, timing, and unsupported-claim review.
    escalationCondition: >
      Message may affect public disclosure, customer trust, legal risk, or regulated notification.
  - id: legal_notification_review
    label: "Legal Notification Review"
    gateType: escalating
    approvalRole: legal_or_privacy_contact
    approvalCondition: >
      Legal or privacy contact confirms whether notification obligations apply.
    escalationCondition: >
      Incident may involve personal data, contractual notice, regulatory notification, or legal exposure.
  - id: recovery_validation
    label: "Recovery Validation"
    gateType: validating
    approvalRole: technical_lead
    approvalCondition: >
      Technical lead confirms service health, residual risk, and recovery evidence.
    escalationCondition: >
      Recovery is partial, unstable, unverified, or requires exceptional risk acceptance.
  - id: closure_approval
    label: "Closure Approval"
    gateType: blocking
    approvalRole: incident_commander
    approvalCondition: >
      Incident commander approves closure with evidence, communications, and follow-up ownership recorded.
    escalationCondition: >
      Closure would hide unresolved customer impact, unknown cause, or unowned remediation.
