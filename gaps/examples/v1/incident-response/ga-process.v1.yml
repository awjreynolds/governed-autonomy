process:
  id: incident-response
  name: "Incident Response"
  purpose: >
    Coordinate detection, triage, containment, eradication, recovery, communication, and post-incident learning while preserving named human accountability during time-critical operational events.
  scope:
    includes:
      - "security and reliability incident intake"
      - "severity classification"
      - "containment and rollback recommendations"
      - "evidence capture"
      - "internal and external communication preparation"
      - "recovery verification"
      - "post-incident review and follow-up actions"
    excludes:
      - "autonomous public disclosure"
      - "autonomous legal determination"
      - "unilateral production shutdown outside approved emergency authority"
      - "permanent policy changes without governance approval"
