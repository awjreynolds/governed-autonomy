lanes:
  - id: intake_and_case_opening
    label: "Intake And Case Opening"
    purpose: >
      Create a canonical case record, identify named owners, and start deadline clocks.
    authority:
      plane: data_plane
      autonomyTier: draft
      riskTier: medium
      allowedActions:
        - draft-decision-record
      prohibitedActions:
        - propose-classification
    stateModel:
      states:
        - id: new_request
          label: new_request
          isInitial: true
        - id: awaiting_minimum_information
          label: awaiting_minimum_information
        - id: intake_accepted
          label: intake_accepted
        - id: rejected_out_of_scope
          label: rejected_out_of_scope
        - id: redirected_to_other_process
          label: redirected_to_other_process
          isTerminal: true
      transitions:
        - id: t-new-request-to-awaiting-minimum-information
          from: new_request
          to: awaiting_minimum_information
        - id: t-awaiting-minimum-information-to-intake-accepted
          from: awaiting_minimum_information
          to: intake_accepted
        - id: t-intake-accepted-to-rejected-out-of-scope
          from: intake_accepted
          to: rejected_out_of_scope
        - id: t-rejected-out-of-scope-to-redirected-to-other-process
          from: rejected_out_of_scope
          to: redirected_to_other_process
    autonomousResponsibilities: []
    skills: []
  - id: scoping_and_policy_route
    label: "Scoping And Policy Route"
    purpose: >
      Decide which policy questions, authority thresholds, and case activities are in scope.
    authority:
      plane: data_plane
      autonomyTier: recommend
      riskTier: high
      allowedActions:
        - draft-decision-record
      prohibitedActions:
        - make-binding-policy-interpretation
        - downgrade-required-authority
        - propose-route
    stateModel:
      states:
        - id: policy_route_pending
          label: policy_route_pending
          isInitial: true
        - id: routine_review
          label: routine_review
        - id: specialist_review_required
          label: specialist_review_required
        - id: senior_review_required
          label: senior_review_required
        - id: director_decision_required
          label: director_decision_required
        - id: paused_for_external_dependency
          label: paused_for_external_dependency
          isTerminal: true
      transitions:
        - id: t-policy-route-pending-to-routine-review
          from: policy_route_pending
          to: routine_review
        - id: t-routine-review-to-specialist-review-required
          from: routine_review
          to: specialist_review_required
        - id: t-specialist-review-required-to-senior-review-required
          from: specialist_review_required
          to: senior_review_required
        - id: t-senior-review-required-to-director-decision-required
          from: senior_review_required
          to: director_decision_required
        - id: t-director-decision-required-to-paused-for-external-dependency
          from: director_decision_required
          to: paused_for_external_dependency
    autonomousResponsibilities:
      - draft-decision-record
      - circumvent-policy-threshold
      - propose-plan
    skills: []
  - id: evidence_collection
    label: "Evidence Collection"
    purpose: >
      Gather, validate, and preserve evidence needed for adaptive review activities.
    authority:
      plane: data_plane
      autonomyTier: execute_with_approval
      riskTier: medium
      allowedActions:
        - edit-repository-file-in-boundary
        - observe-evidence
      prohibitedActions:
        - infer-from-missing-evidence
        - alter-recorded-evidence
        - close-unverified-work
    stateModel:
      states:
        - id: evidence_requested
          label: evidence_requested
          isInitial: true
        - id: awaiting_requester_response
          label: awaiting_requester_response
        - id: evidence_received
          label: evidence_received
        - id: evidence_gap_identified
          label: evidence_gap_identified
        - id: evidence_sufficient_for_draft
          label: evidence_sufficient_for_draft
        - id: overdue_response
          label: overdue_response
          isTerminal: true
      transitions:
        - id: t-evidence-requested-to-awaiting-requester-response
          from: evidence_requested
          to: awaiting_requester_response
        - id: t-awaiting-requester-response-to-evidence-received
          from: awaiting_requester_response
          to: evidence_received
        - id: t-evidence-received-to-evidence-gap-identified
          from: evidence_received
          to: evidence_gap_identified
        - id: t-evidence-gap-identified-to-evidence-sufficient-for-draft
          from: evidence_gap_identified
          to: evidence_sufficient_for_draft
        - id: t-evidence-sufficient-for-draft-to-overdue-response
          from: evidence_sufficient_for_draft
          to: overdue_response
    autonomousResponsibilities:
      - request-evidence
      - conceal-material-information
      - observe-evidence
    skills: []
  - id: resource_and_budget_control
    label: "Resource And Budget Control"
    purpose: >
      Control specialist time, external review spend, and review capacity before committing resources.
    authority:
      plane: control_plane
      autonomyTier: draft
      riskTier: high
      allowedActions:
        - request-evidence
        - propose-classification
        - update-local-state
      prohibitedActions:
        - approve-scope-boundary
        - comment-on-external-ticket
    stateModel:
      states:
        - id: no_extra_resource_required
          label: no_extra_resource_required
          isInitial: true
        - id: specialist_or_budget_requested
          label: specialist_or_budget_requested
        - id: awaiting_resource_decision
          label: awaiting_resource_decision
        - id: resource_approved_with_limits
          label: resource_approved_with_limits
        - id: resource_declined
          label: resource_declined
        - id: capacity_escalation_required
          label: capacity_escalation_required
          isTerminal: true
      transitions:
        - id: t-no-extra-resource-required-to-specialist-or-budget-requested
          from: no_extra_resource_required
          to: specialist_or_budget_requested
        - id: t-specialist-or-budget-requested-to-awaiting-resource-decision
          from: specialist_or_budget_requested
          to: awaiting_resource_decision
        - id: t-awaiting-resource-decision-to-resource-approved-with-limits
          from: awaiting_resource_decision
          to: resource_approved_with_limits
        - id: t-resource-approved-with-limits-to-resource-declined
          from: resource_approved_with_limits
          to: resource_declined
        - id: t-resource-declined-to-capacity-escalation-required
          from: resource_declined
          to: capacity_escalation_required
    autonomousResponsibilities:
      - draft-decision-record
    skills: []
  - id: analysis_and_draft_decision
    label: "Analysis And Draft Decision"
    purpose: >
      Convert evidence and policy route into review options, risk notes, and a draft determination.
    authority:
      plane: data_plane
      autonomyTier: draft
      riskTier: high
      allowedActions:
        - draft-artifact
        - draft-decision-record
      prohibitedActions:
        - approve-closure
        - sign-binding-document
        - infer-from-missing-evidence
    stateModel:
      states:
        - id: analysis_in_progress
          label: analysis_in_progress
          isInitial: true
        - id: awaiting_specialist_input
          label: awaiting_specialist_input
        - id: draft_decision_ready
          label: draft_decision_ready
        - id: rework_required
          label: rework_required
        - id: high_risk_escalation_required
          label: high_risk_escalation_required
          isTerminal: true
      transitions:
        - id: t-analysis-in-progress-to-awaiting-specialist-input
          from: analysis_in_progress
          to: awaiting_specialist_input
        - id: t-awaiting-specialist-input-to-draft-decision-ready
          from: awaiting_specialist_input
          to: draft_decision_ready
        - id: t-draft-decision-ready-to-rework-required
          from: draft_decision_ready
          to: rework_required
        - id: t-rework-required-to-high-risk-escalation-required
          from: rework_required
          to: high_risk_escalation_required
    autonomousResponsibilities:
      - infer-from-missing-evidence
      - draft-decision-record
      - propose-classification
    skills: []
  - id: authority_decision_and_communication
    label: "Authority Decision And Communication"
    purpose: >
      Apply the correct human authority level, record the decision, and communicate outcome.
    authority:
      plane: control_plane
      autonomyTier: execute_with_approval
      riskTier: human_only
      allowedActions:
        - approve-gate
      prohibitedActions:
        - approve-closure
        - expand-scope-silently
    stateModel:
      states:
        - id: awaiting_delegated_decision
          label: awaiting_delegated_decision
          isInitial: true
        - id: awaiting_director_decision
          label: awaiting_director_decision
        - id: approved_for_communication
          label: approved_for_communication
        - id: decision_issued
          label: decision_issued
        - id: decision_paused_by_event
          label: decision_paused_by_event
        - id: reopened_after_new_information
          label: reopened_after_new_information
          isTerminal: true
      transitions:
        - id: t-awaiting-delegated-decision-to-awaiting-director-decision
          from: awaiting_delegated_decision
          to: awaiting_director_decision
        - id: t-awaiting-director-decision-to-approved-for-communication
          from: awaiting_director_decision
          to: approved_for_communication
        - id: t-approved-for-communication-to-decision-issued
          from: approved_for_communication
          to: decision_issued
        - id: t-decision-issued-to-decision-paused-by-event
          from: decision_issued
          to: decision_paused_by_event
        - id: t-decision-paused-by-event-to-reopened-after-new-information
          from: decision_paused_by_event
          to: reopened_after_new_information
    autonomousResponsibilities:
      - draft-decision-record
      - escalate-to-higher-authority
      - draft-artifact
    skills: []
  - id: monitoring_and_closure
    label: "Monitoring And Closure"
    purpose: >
      Monitor post-decision obligations, handle event-driven reopening, and close the case record.
    authority:
      plane: data_plane
      autonomyTier: recommend
      riskTier: medium
      allowedActions:
        - propose-classification
      prohibitedActions:
        - destroy-evidence-or-state
        - close-unverified-work
    stateModel:
      states:
        - id: post_decision_monitoring
          label: post_decision_monitoring
          isInitial: true
        - id: awaiting_follow_up_action
          label: awaiting_follow_up_action
        - id: reopened
          label: reopened
        - id: closure_ready
          label: closure_ready
        - id: closed
          label: closed
        - id: lessons_review_required
          label: lessons_review_required
          isTerminal: true
      transitions:
        - id: t-post-decision-monitoring-to-awaiting-follow-up-action
          from: post_decision_monitoring
          to: awaiting_follow_up_action
        - id: t-awaiting-follow-up-action-to-reopened
          from: awaiting_follow_up_action
          to: reopened
        - id: t-reopened-to-closure-ready
          from: reopened
          to: closure_ready
        - id: t-closure-ready-to-closed
          from: closure_ready
          to: closed
        - id: t-closed-to-lessons-review-required
          from: closed
          to: lessons_review_required
    autonomousResponsibilities:
      - close-unverified-work
      - recommend-readiness
    skills: []
gates:
  - id: intake_acceptance
    label: "Intake Acceptance"
    gateType: validating
    approvalRole: case_owner
    approvalCondition: >
      Named case owner confirms scope, requester, minimum information, and deadline clock.
    escalationCondition: >
      Request may trigger statutory, legal, executive, or emergency handling outside this process.
  - id: deadline_clock_started
    label: "Deadline Clock Started"
    gateType: blocking
    approvalRole: case_owner
    approvalCondition: >
      Applicable statutory or policy deadline basis is recorded before substantive review starts.
    escalationCondition: "Deadline basis is unclear, already breached, or disputed."
  - id: policy_route_validation
    label: "Policy Route Validation"
    gateType: validating
    approvalRole: policy_specialist
    approvalCondition: >
      Policy specialist validates route, assumptions, and unresolved ambiguity register.
    escalationCondition: >
      Policy ambiguity, precedent conflict, or high-impact requester consequences are identified.
  - id: authority_threshold_check
    label: "Authority Threshold Check"
    gateType: escalating
    approvalRole: senior_reviewer
    approvalCondition: "Senior reviewer confirms whether delegated authority is sufficient."
    escalationCondition: >
      Case crosses value, sensitivity, legal, reputational, vulnerable-person, or precedent thresholds.
  - id: evidence_request_approval
    label: "Evidence Request Approval"
    gateType: advisory
    approvalRole: case_owner
    approvalCondition: >
      Case owner approves wording where request is routine and inside policy templates.
    escalationCondition: >
      Evidence request may create legal risk, require sensitive data, or contact an external authority.
  - id: evidence_sufficiency
    label: "Evidence Sufficiency"
    gateType: validating
    approvalRole: senior_reviewer
    approvalCondition: >
      Evidence is sufficient to draft options or the residual gaps are explicitly accepted.
    escalationCondition: >
      Evidence is contradictory, incomplete near deadline, or disputed by a named party.
  - id: budget_approval
    label: "Budget Approval"
    gateType: blocking
    approvalRole: budget_holder
    approvalCondition: >
      Budget holder approves specialist time, paid review, or external support with explicit limits.
    escalationCondition: >
      Resource delay threatens deadline, exceeds local limit, or would compromise review quality.
  - id: capacity_escalation
    label: "Capacity Escalation"
    gateType: escalating
    approvalRole: accountable_director
    approvalCondition: >
      Accountable director accepts capacity plan for deadline-critical or high-impact cases.
    escalationCondition: >
      No reviewer capacity is available before statutory or policy deadline warning threshold.
  - id: specialist_input_check
    label: "Specialist Input Check"
    gateType: blocking
    approvalRole: policy_specialist
    approvalCondition: >
      Required specialist input is complete or explicitly waived by the accountable human role.
    escalationCondition: >
      Specialist input is unavailable and deadline or decision quality is at risk.
  - id: draft_quality_review
    label: "Draft Quality Review"
    gateType: validating
    approvalRole: senior_reviewer
    approvalCondition: >
      Draft analysis is traceable to evidence and separates facts, policy interpretation, and recommendations.
    escalationCondition: >
      Draft contains unsupported findings, hidden assumptions, legal conclusions, or unowned residual risk.
  - id: final_authority_approval
    label: "Final Authority Approval"
    gateType: blocking
    approvalRole: senior_reviewer
    approvalCondition: >
      Senior reviewer or higher authority records explicit decision and confirms delegated authority.
    escalationCondition: >
      Authority threshold requires director, legal, board, or external authority involvement.
  - id: high_risk_director_escalation
    label: "High Risk Director Escalation"
    gateType: escalating
    approvalRole: accountable_director
    approvalCondition: >
      Director approves or redirects high-risk determination before communication.
    escalationCondition: >
      Case affects precedent, public commitment, significant spend, statutory exposure, or high-impact individual outcome.
  - id: communication_release
    label: "Communication Release"
    gateType: blocking
    approvalRole: case_owner
    approvalCondition: "Communication matches approved determination and required notices."
    escalationCondition: >
      Requester disputes facts, new information arrives, deadline has breached, or communication channel is not approved.
  - id: closure_validation
    label: "Closure Validation"
    gateType: validating
    approvalRole: case_owner
    approvalCondition: >
      All obligations are complete, evidence references are retained, and no event trigger is unresolved.
    escalationCondition: >
      Closure would leave an unresolved appeal, complaint, deadline breach, or unowned follow-up.
  - id: lessons_review_trigger
    label: "Lessons Review Trigger"
    gateType: advisory
    approvalRole: senior_reviewer
    approvalCondition: "Senior reviewer decides whether process learning is required."
    escalationCondition: >
      Deadline breach, evidence failure, authority mismatch, or resource gate failure occurred.
projectionPolicy:
  canonicalStateSource: repo-local-ledger
  pathPattern: "compliance-review/cases/{caseId}/case-record.yml"
riskPatterns:
  - patternRef: chat-as-control-plane
    mitigations:
      - >
        Named case record and approval events remain canonical; chat summaries are non-canonical projections.
  - patternRef: unbounded-delegation
    mitigations:
      - >
        Autonomous work is limited to drafting, summarizing, monitoring, and approved administrative execution.
  - patternRef: role-collapse
    mitigations:
      - >
        Case owner, policy specialist, senior reviewer, budget holder, legal liaison, and director authority are separated.
  - patternRef: evidence-drift
    mitigations:
      - >
        Evidence index, source reliability notes, gap register, and event log are part of canonical case state.
  - patternRef: approval-theater
    mitigations:
      - >
        Decision gates require named human approver, authority level, approval condition, and escalation condition.
  - patternRef: tool-sprawl
    mitigations:
      - >
        Mailbox, tickets, documents, calendars, and dashboards are projections rather than independent workflow authorities.
  - patternRef: accountability-gaps
    mitigations:
      - >
        Named human identities are recorded for ownership, resource decisions, specialist input, and final authority.
  - patternRef: evidence-drift
    mitigations:
      - >
        Deadline clocks, warning thresholds, breach events, and escalation gates are modeled explicitly.
  - patternRef: accountability-gaps
    mitigations:
      - >
        Specialist time, paid review, and capacity commitments require budget holder or director gates.
  - patternRef: scope-creep-at-machine-speed
    mitigations:
      - >
        Policy route and draft decision lanes require human validation before determination or communication.
  - patternRef: evidence-drift
    mitigations:
      - >
        Appeal, complaint, new evidence, deadline, budget, capacity, and policy-update events trigger reopening or escalation checks.
