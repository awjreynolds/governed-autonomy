process:
  id: compliance-review-casework
  name: "Compliance Review Casework"
  purpose: >
    Coordinate an adaptive compliance-review case from intake through scoping, evidence collection, policy analysis, authority review, resource approval, decision recording, monitoring, and closure while preserving named human accountability.
  scope:
    includes:
      - "non-emergency compliance inquiries"
      - "policy applicability reviews"
      - "evidence requests and case correspondence"
      - "deadline tracking"
      - "budget or specialist resource approval"
      - "authority escalation and decision recording"
      - "post-decision monitoring and closure"
    excludes:
      - "legal advice"
      - "formal regulatory submissions"
      - "certification audits"
      - "emergency enforcement action"
      - "automated final determinations"
  localActions:
    - id: recommend-intake-acceptance-or-redirection
      label: "recommend intake acceptance or redirection"
      category: data-plane-persist
