evidenceModel:
  caseFileItems:
    - id: migrated-process-state
      label: "Migrated v0.1 process state placeholder"
      kind: state-transition-event
      producer: lane:intake_and_business_need
      consumer:
        - role:requester
lanes:
  - id: intake_and_business_need
    label: "Intake And Business Need"
    purpose: >
      Establish the business need, minimum request facts, and canonical request record.
    authority:
      plane: data_plane
      autonomyTier: draft
      riskTier: low
      allowedActions:
        - draft-decision-record
        - request-clarification
      prohibitedActions:
        - approve-scope-boundary
        - approve-closure
    stateModel:
      states:
        - id: request_submitted
          label: request_submitted
          isInitial: true
        - id: awaiting_minimum_information
          label: awaiting_minimum_information
        - id: intake_complete
          label: intake_complete
        - id: rejected_incomplete
          label: rejected_incomplete
        - id: redirected_to_sourcing
          label: redirected_to_sourcing
          isTerminal: true
      transitions:
        - id: t-request-submitted-to-awaiting-minimum-information
          from: request_submitted
          to: awaiting_minimum_information
        - id: t-awaiting-minimum-information-to-intake-complete
          from: awaiting_minimum_information
          to: intake_complete
        - id: t-intake-complete-to-rejected-incomplete
          from: intake_complete
          to: rejected_incomplete
        - id: t-rejected-incomplete-to-redirected-to-sourcing
          from: rejected_incomplete
          to: redirected_to_sourcing
    autonomousResponsibilities:
      - infer-from-missing-evidence
      - propose-route
    skills: []
  - id: supplier_and_policy_review
    label: "Supplier And Policy Review"
    purpose: >
      Assess supplier risk, policy applicability, conflicts, and required specialist reviews.
    authority:
      plane: data_plane
      autonomyTier: recommend
      riskTier: medium
      allowedActions:
        - propose-classification
      prohibitedActions:
        - approve-scope-boundary
    stateModel:
      states:
        - id: supplier_review_pending
          label: supplier_review_pending
          isInitial: true
        - id: low_risk_supplier
          label: low_risk_supplier
        - id: specialist_review_required
          label: specialist_review_required
        - id: conflict_review_required
          label: conflict_review_required
        - id: supplier_rejected
          label: supplier_rejected
          isTerminal: true
      transitions:
        - id: t-supplier-review-pending-to-low-risk-supplier
          from: supplier_review_pending
          to: low_risk_supplier
        - id: t-low-risk-supplier-to-specialist-review-required
          from: low_risk_supplier
          to: specialist_review_required
        - id: t-specialist-review-required-to-conflict-review-required
          from: specialist_review_required
          to: conflict_review_required
        - id: t-conflict-review-required-to-supplier-rejected
          from: conflict_review_required
          to: supplier_rejected
    autonomousResponsibilities:
      - recommend-readiness
    skills: []
  - id: budget_and_value_approval
    label: "Budget And Value Approval"
    purpose: >
      Confirm budget availability, spend threshold, value rationale, and independent budget approval.
    authority:
      plane: control_plane
      autonomyTier: draft
      riskTier: high
      allowedActions:
        - propose-route
        - escalate-to-human
      prohibitedActions:
        - approve-scope-boundary
    stateModel:
      states:
        - id: budget_review_pending
          label: budget_review_pending
          isInitial: true
        - id: budget_approved
          label: budget_approved
        - id: budget_capped
          label: budget_capped
        - id: budget_rejected
          label: budget_rejected
        - id: executive_spend_approval_required
          label: executive_spend_approval_required
          isTerminal: true
      transitions:
        - id: t-budget-review-pending-to-budget-approved
          from: budget_review_pending
          to: budget_approved
        - id: t-budget-approved-to-budget-capped
          from: budget_approved
          to: budget_capped
        - id: t-budget-capped-to-budget-rejected
          from: budget_capped
          to: budget_rejected
        - id: t-budget-rejected-to-executive-spend-approval-required
          from: budget_rejected
          to: executive_spend_approval_required
    autonomousResponsibilities:
      - infer-from-missing-evidence
    skills: []
  - id: contract_and_purchase_authorization
    label: "Contract And Purchase Authorization"
    purpose: >
      Complete contract route, confirm required reviews, and authorize purchase only after prior gates are satisfied.
    authority:
      plane: control_plane
      autonomyTier: draft
      riskTier: high
      allowedActions:
        - approve-gate
      prohibitedActions:
        - sign-binding-document
        - approve-scope-boundary
        - request-evidence
    stateModel:
      states:
        - id: contract_review_pending
          label: contract_review_pending
          isInitial: true
        - id: standard_terms_accepted
          label: standard_terms_accepted
        - id: legal_review_required
          label: legal_review_required
        - id: purchase_authorized
          label: purchase_authorized
        - id: purchase_rejected
          label: purchase_rejected
          isTerminal: true
      transitions:
        - id: t-contract-review-pending-to-standard-terms-accepted
          from: contract_review_pending
          to: standard_terms_accepted
        - id: t-standard-terms-accepted-to-legal-review-required
          from: standard_terms_accepted
          to: legal_review_required
        - id: t-legal-review-required-to-purchase-authorized
          from: legal_review_required
          to: purchase_authorized
        - id: t-purchase-authorized-to-purchase-rejected
          from: purchase_authorized
          to: purchase_rejected
    autonomousResponsibilities:
      - recommend-readiness
      - run-validation
      - record-gate-decision
      - draft-decision-record
    skills: []
  - id: monitoring_and_renewal
    label: "Monitoring And Renewal"
    purpose: >
      Track obligations, renewal dates, spend drift, supplier risk changes, and closure evidence.
    authority:
      plane: data_plane
      autonomyTier: autonomous_with_monitoring
      riskTier: medium
      allowedActions: []
      prohibitedActions:
        - propose-design
        - approve-scope-boundary
        - close-unverified-work
    stateModel:
      states:
        - id: purchase_active
          label: purchase_active
          isInitial: true
        - id: obligations_tracking
          label: obligations_tracking
        - id: renewal_review_due
          label: renewal_review_due
        - id: spend_drift_detected
          label: spend_drift_detected
        - id: procurement_record_closed
          label: procurement_record_closed
          isTerminal: true
      transitions:
        - id: t-purchase-active-to-obligations-tracking
          from: purchase_active
          to: obligations_tracking
        - id: t-obligations-tracking-to-renewal-review-due
          from: obligations_tracking
          to: renewal_review_due
        - id: t-renewal-review-due-to-spend-drift-detected
          from: renewal_review_due
          to: spend_drift_detected
        - id: t-spend-drift-detected-to-procurement-record-closed
          from: spend_drift_detected
          to: procurement_record_closed
    autonomousResponsibilities:
      - draft-artifact
    skills: []
gates:
  - id: intake_completeness
    label: "Intake Completeness"
    gateType: validating
    approvalRole: procurement_owner
    approvalCondition: "Procurement owner confirms minimum request facts and route are present."
    escalationCondition: >
      Request is urgent, incomplete, sole-source, conflicted, or outside standard procurement route.
  - id: supplier_risk_validation
    label: "Supplier Risk Validation"
    gateType: validating
    approvalRole: supplier_risk_owner
    approvalCondition: >
      Supplier risk owner validates risk tier, required specialist reviews, and unresolved risk.
    escalationCondition: >
      Supplier handles sensitive data, critical service, high resilience dependency, or unresolved conflict.
  - id: conflict_escalation
    label: "Conflict Escalation"
    gateType: escalating
    approvalRole: approver
    approvalCondition: >
      Independent approver confirms conflict disposition before purchase approval can proceed.
    escalationCondition: >
      Requester, approver, or supplier relationship creates perceived or actual conflict.
  - id: budget_approval
    label: "Budget Approval"
    gateType: blocking
    approvalRole: budget_holder
    approvalCondition: >
      Budget holder approves amount, budget line, total cost basis, and any spending limit.
    escalationCondition: >
      Spend exceeds delegated authority, budget is unavailable, or value rationale is insufficient.
  - id: spend_threshold_escalation
    label: "Spend Threshold Escalation"
    gateType: escalating
    approvalRole: approver
    approvalCondition: "Independent approver confirms threshold route and segregation of duties."
    escalationCondition: >
      Requester and budget approver are not independent, threshold is disputed, or purchase is split.
  - id: contract_route_approval
    label: "Contract Route Approval"
    gateType: blocking
    approvalRole: legal_contact
    approvalCondition: >
      Legal or contract contact confirms standard terms, approved template, or legal review route.
    escalationCondition: >
      Contract includes non-standard terms, data processing, liability change, or unusual renewal obligations.
  - id: purchase_authorization
    label: "Purchase Authorization"
    gateType: blocking
    approvalRole: approver
    approvalCondition: >
      Independent approver confirms required gates, segregation of duties, and purchase decision.
    escalationCondition: >
      Prior gate evidence is missing, approver independence is weak, or residual risk is unowned.
  - id: renewal_review_trigger
    label: "Renewal Review Trigger"
    gateType: validating
    approvalRole: procurement_owner
    approvalCondition: >
      Procurement owner confirms renewal review is scheduled with current spend, scope, and risk evidence.
    escalationCondition: >
      Renewal is automatic, spend drift exists, supplier risk changed, or owner is missing.
  - id: obligation_closure
    label: "Obligation Closure"
    gateType: blocking
    approvalRole: procurement_owner
    approvalCondition: >
      Procurement owner confirms obligations are complete or transferred before record closure.
    escalationCondition: "Open obligations, unresolved risk, or missing contract evidence remain."
